name: Build FAU Offensive Tells PDF

on:
  push:
    paths:
      - '.github/workflows/fau-tells-deploy.yml'

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild PDF from chunks
        run: |
          cat .tmp/fau_pdf_01.b64 .tmp/fau_pdf_02.b64 .tmp/fau_pdf_03.b64 .tmp/fau_pdf_04.b64 .tmp/fau_pdf_05.b64 .tmp/fau_pdf_06.b64 | base64 --decode > FAU_Tells_Final.pdf
          file FAU_Tells_Final.pdf
          test "$(head -c 5 FAU_Tells_Final.pdf)" = "%PDF-"

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FAU_Tells_Final.pdf
          git diff --cached --quiet && exit 0
          git commit -m "Add Florida Atlantic offensive tells PDF"
          git push
